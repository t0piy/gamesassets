name: Rat King Revolutionary Banner DMM artifacts
on:
  push:
    paths:
      - 'deadlock-ratking-gadsden/**'
      - '.github/workflows/deadlock-ratking-gadsden-package.yml'
  workflow_dispatch:

concurrency:
  group: ratking-revolutionary-banner-artifacts
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  DMM_CODEC_COMMIT: b0992fee210555a9cd2ea44f4ceba2a51983144d
  RATKING_FLAG_TEXTURE: models/heroes_wip/ratking/materials/ratking_ratannia_flag_color_png_155b4b23.vtex_c

jobs:
  build-installable-artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deadlock-ratking-gadsden

    steps:
      - name: Remove previous Rat King banner artifacts
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("ratking-gadsden-")) or (.name | startswith("ratking-banner-"))) | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install raster and VPK validation dependencies
        run: python -m pip install --disable-pip-version-check pillow vpk

      - name: Fetch and verify three raster originals
        run: python tools/fetch_source.py

      - name: Prepare six high-quality raster variants
        run: python tools/prepare_rasters.py

      - name: Prepare exact 2048x1024 game texture payloads
        run: python tools/prepare_dmm_payloads.py

      - name: Fetch pinned Deadlock Mod Manager codec
        working-directory: .
        run: |
          set -euxo pipefail
          rm -rf /tmp/dmm-codec
          git init /tmp/dmm-codec
          git -C /tmp/dmm-codec remote add origin https://github.com/deadlock-mod-manager/deadlock-mod-manager.git
          git -C /tmp/dmm-codec fetch --depth 1 origin "$DMM_CODEC_COMMIT"
          git -C /tmp/dmm-codec checkout --detach FETCH_HEAD
          test -f /tmp/dmm-codec/packages/vpkmanager/Cargo.toml

      - name: Compile minimal VPK builder
        working-directory: .
        run: |
          set -euxo pipefail
          rm -rf /tmp/ratking-vpk-builder
          mkdir -p /tmp/ratking-vpk-builder/src
          cat > /tmp/ratking-vpk-builder/Cargo.toml <<'EOF'
          [package]
          name = "ratking-vpk-builder"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          vpkmanager = { path = "/tmp/dmm-codec/packages/vpkmanager" }
          vpk-parser = { path = "/tmp/dmm-codec/packages/vpk-parser" }
          EOF
          cp deadlock-ratking-gadsden/tools/dmm_vpk_builder.rs /tmp/ratking-vpk-builder/src/main.rs
          RUSTFLAGS='-C link-arg=-lstdc++' cargo build --release --manifest-path /tmp/ratking-vpk-builder/Cargo.toml

      - name: Build six installable VPKs
        run: |
          set -euxo pipefail
          rm -rf dist/installable
          for variant in \
            original-clean \
            original-worn \
            modern-clean \
            modern-worn \
            join-or-die-clean \
            join-or-die-worn
          do
            safe_name="${variant//-/_}"
            out_dir="dist/installable/$variant"
            mkdir -p "$out_dir"
            /tmp/ratking-vpk-builder/target/release/ratking-vpk-builder \
              "dist/dmm-textures/$variant.png" \
              "$out_dir/ratking_banner_${safe_name}_dir.vpk" \
              "/tmp/ratking-stage-$variant"
          done

      - name: Confirm all six DMM-validated VPKs exist
        run: |
          set -euxo pipefail
          count="$(find dist/installable -type f -name '*.vpk' | wc -l)"
          test "$count" -eq 6
          find dist/installable -type f -name '*.vpk' -size +1k -print
          sized_count="$(find dist/installable -type f -name '*.vpk' -size +1k | wc -l)"
          test "$sized_count" -eq 6

      - name: Upload original clean DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-original-clean-DMM
          path: deadlock-ratking-gadsden/dist/installable/original-clean/*.vpk
          if-no-files-found: error
          compression-level: 0

      - name: Upload original worn DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-original-worn-DMM
          path: deadlock-ratking-gadsden/dist/installable/original-worn/*.vpk
          if-no-files-found: error
          compression-level: 0

      - name: Upload modern clean DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-modern-clean-DMM
          path: deadlock-ratking-gadsden/dist/installable/modern-clean/*.vpk
          if-no-files-found: error
          compression-level: 0

      - name: Upload modern worn DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-modern-worn-DMM
          path: deadlock-ratking-gadsden/dist/installable/modern-worn/*.vpk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Join or Die clean DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-join-or-die-clean-DMM
          path: deadlock-ratking-gadsden/dist/installable/join-or-die-clean/*.vpk
          if-no-files-found: error
          compression-level: 0

      - name: Upload Join or Die worn DMM mod
        uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-join-or-die-worn-DMM
          path: deadlock-ratking-gadsden/dist/installable/join-or-die-worn/*.vpk
          if-no-files-found: error
          compression-level: 0
