name: Rat King Revolutionary Banner raster artifacts
on:
  push:
    paths:
      - 'deadlock-ratking-gadsden/**'
      - '.github/workflows/deadlock-ratking-gadsden-package.yml'
  workflow_dispatch:

concurrency:
  group: ratking-revolutionary-banner-raster-artifacts
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  cleanup-old-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Remove previous Rat King banner artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select((.name | startswith("ratking-gadsden-")) or (.name | startswith("ratking-banner-"))) | .id' |
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done

  raster-artifacts:
    needs: cleanup-old-artifacts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - modern-clean
          - modern-worn
          - join-or-die-clean
          - join-or-die-worn
    defaults:
      run:
        working-directory: deadlock-ratking-gadsden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster processing dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch and verify raster originals
        run: python tools/fetch_source.py
      - name: Prepare four 4096px raster variants
        run: python tools/prepare_rasters.py
      - name: Package ${{ matrix.variant }}
        run: python tools/package_sources.py '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ratking-banner-${{ matrix.variant }}-sources
          path: deadlock-ratking-gadsden/dist/ratking-banner-${{ matrix.variant }}-sources.zip
          if-no-files-found: error
