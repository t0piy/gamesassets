name: Inspect Rat King material
on:
  push:
    paths:
      - '.github/workflows/inspect-ratking-material.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download working Rat King flag mod
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-delay 2 -A 'Mozilla/5.0'             'https://gamebanana.com/dl/1835103'             -o /tmp/ref.zip
          mkdir -p /tmp/ref
          unzip -o /tmp/ref.zip -d /tmp/ref
          python -m pip install --disable-pip-version-check vpk
          python - <<'PY'
          from pathlib import Path
          import vpk
          pak_path=next(Path('/tmp/ref').glob('*.vpk'))
          pak=vpk.open(str(pak_path))
          target='models/heroes_wip/ratking/materials/ratking_ratannia_flag.vmat_c'
          data=pak.get_file(target).read()
          Path('/tmp/ratking_ratannia_flag.vmat_c').write_bytes(data)
          print('VMAT_BYTES',len(data))
          PY

      - name: Parse material with pinned morphic
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/Slush97/vpkmerge.git /tmp/vpkmerge
          git -C /tmp/vpkmerge checkout f3bf777a04f08aa03721e75988ecd7fbb986734b
          mkdir -p /tmp/matinspect/src
          cat > /tmp/matinspect/Cargo.toml <<'EOF'
          [package]
          name = "matinspect"
          version = "0.1.0"
          edition = "2024"

          [dependencies]
          morphic = { path = "/tmp/vpkmerge/morphic" }
          EOF
          cat > /tmp/matinspect/src/main.rs <<'EOF'
          use std::fs;
          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let bytes=fs::read("/tmp/ratking_ratannia_flag.vmat_c")?;
              let mat=morphic::material::parse(&bytes)?;
              println!("NAME={}",mat.name);
              println!("SHADER={}",mat.shader_name);
              println!("TEXTURES");
              for (k,v) in &mat.texture_params { println!("  {}={}",k,v); }
              println!("INTS");
              for (k,v) in &mat.int_params { println!("  {}={}",k,v); }
              println!("FLOATS");
              for (k,v) in &mat.float_params { println!("  {}={}",k,v); }
              println!("VECTORS");
              for (k,v) in &mat.vector_params { println!("  {}={:?}",k,v); }
              Ok(())
          }
          EOF
          RUSTFLAGS='-C link-arg=-lstdc++' cargo run --release --manifest-path /tmp/matinspect/Cargo.toml
